<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kent City School - Report Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f5f8; }
        
        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Modern custom file input styling */
        input[type="file"]::file-selector-button {
            border: none;
            background: #EFF6FF;
            padding: 0.5rem 1rem;
            border-radius: 9999px; /* full rounded */
            color: #1D4ED8;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-right: 1.5rem;
        }
        input[type="file"]::file-selector-button:hover {
            background: #DBEAFE;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-6">

    <!-- Header & Logo -->
    <div class="w-full max-w-3xl flex flex-col items-center mb-10">
        <img src="/assets/school_logo.png" alt="School Logo" class="h-28 object-contain mb-5" onerror="this.style.display='none'">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Report Generator Tool</h1>
        <p class="text-gray-500 text-base mt-2 font-medium">Automated Students Report Card System</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        
        <!-- Top Bar -->
        <div class="bg-gray-50/50 px-8 py-5 border-b border-gray-100 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800">Configuration Parameters</h2>
            <a href="/download-template" class="text-sm font-semibold text-blue-600 hover:text-blue-700 hover:underline flex items-center gap-1.5 transition-colors bg-blue-50 px-3 py-1.5 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Download Template
            </a>
        </div>
        
        <form id="reportForm" class="p-8">
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-7">
                <!-- File Upload -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Upload Excel Data File <span class="text-red-500">*</span></label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-200 border-dashed rounded-xl hover:border-blue-400 hover:bg-blue-50/30 transition-all bg-gray-50/50 group">
                        <div class="space-y-1 text-center w-full">
                            <input type="file" id="excel_file" name="excel_file" accept=".xlsx,.xls" required class="w-full text-sm text-gray-500 focus:outline-none cursor-pointer group-hover:text-gray-700 transition-colors"/>
                        </div>
                    </div>
                </div>

                <!-- Session -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Session <span class="text-red-500">*</span></label>
                    <select name="session" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none shadow-sm cursor-pointer appearance-none">
                        <option value="2024-2025">2024 - 2025</option>
                        <option value="2025-2026">2025 - 2026</option>
                        <option value="2026-2027">2026 - 2027</option>
                    </select>
                </div>


                <!-- Semester -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Semester Selection <span class="text-red-500">*</span></label>
                    <select name="semester" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none shadow-sm cursor-pointer appearance-none">
                        <option value="First Semester">First Semester</option>
                        <option value="Second Semester">Second Semester</option>
                        <option value="Third Semester">Third Semester</option>
                        <option value="Annual Evaluation">Annual Evaluation</option>
                    </select>
                </div>

                <!-- Campus -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Campus</label>
                    <select name="campus" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none shadow-sm cursor-pointer appearance-none">
                        <option value="Zaman Town">Zaman Town</option>
                        <option value="Other">Other Campus</option>
                    </select>
                </div>

            </div>

            <!-- Submit -->
            <div class="mt-8 pt-8 border-t border-gray-100 flex justify-end">
                <button type="submit" id="submitBtn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-xl font-bold transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
                    <div class="spinner" id="btnSpinner"></div>
                    <span id="btnText">Generate & Download Reports</span>
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');
            
            // UI Loading state
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.innerText = 'Processing...';
            alertBox.classList.add('hidden');

            try {
                const formData = new FormData(form);
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    let filename = "Reports.zip";
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition && disposition.indexOf('attachment') !== -1) {
                        const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        const matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) { 
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                } else {
                    const errText = await response.text();
                    throw new Error(errText || 'Failed to generate reports');
                }
            } catch (error) {
                alertBox.innerText = error.message;
                alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium border bg-red-50 text-red-700 border-red-200 block';
            } finally {
                // Restore UI state
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Generate & Download Reports';
            }
        });
    </script>
</body>
</html>
